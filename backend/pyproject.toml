[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moe-router-visualizer"
version = "0.1.0"
description = "Interactive MoE Router Visualization Tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "python-multipart>=0.0.12",
    "mlx>=0.21.0",
    "mlx-lm>=0.20.0",
    "numpy>=1.26.0",
    "safetensors>=0.4.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "psutil>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "black>=24.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ['py311']
